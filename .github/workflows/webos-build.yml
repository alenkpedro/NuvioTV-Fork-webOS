name: webOS build and tests
on:
  workflow_dispatch:
  push:
    branches: [webos]
    paths: ['webos/**', '.github/workflows/webos-build.yml']
  pull_request:
    branches: [webos]
    paths: ['webos/**', '.github/workflows/webos-build.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package:webos
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-fork-webos
          path: webos/packages/*.ipk
