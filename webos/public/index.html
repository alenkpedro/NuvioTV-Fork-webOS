<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nuvio Fork · LG webOS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <div class="boot-splash" role="status" aria-label="Iniciando o Nuvio Fork">
      <img class="boot-wordmark" src="assets/wordmark.png" alt="Nuvio">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Iniciando…</p>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
